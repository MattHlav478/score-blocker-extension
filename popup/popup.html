<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="sb-head">
      <h1>Score Blocker</h1>
      <span id="state" class="sb-state">…</span>
    </header>

    <label class="sb-toggle">
      <input type="checkbox" id="enabled" />
      <span class="sb-track"><span class="sb-thumb"></span></span>
      <span class="sb-toggle-label">Blur scores</span>
    </label>

    <label class="sb-toggle sb-toggle-match" id="match-day-row">
      <input type="checkbox" id="matchDay" />
      <span class="sb-track"><span class="sb-thumb"></span></span>
      <span class="sb-toggle-label">Match day</span>
    </label>

    <p class="sb-match-note" id="match-note" hidden>
      Descriptions and comments hidden, thumbnails hidden on sports results.
    </p>

    <p class="sb-count"><strong id="count">0</strong> <span id="count-label">scores hidden on this page</span></p>

    <footer class="sb-foot">
      <a href="#" id="options">Settings — keywords, teams, sites</a>
    </footer>

    <script src="../common/defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
